# Unit tests and lint on every push and PR. Free to run, unlike the eval
# fast tier, which stays manual-trigger only (TICKET-001 §4 Q13).
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - name: Check ground truth points at its evidence
        run: python -m eval check-truth
