[project]
name = "security-skills"
version = "0.1.0"
description = "Security Agent Skills plugin and the automated checker that evaluates it"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.18",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["eval"]

[tool.pytest.ini_options]
testpaths = ["eval/tests"]
pythonpath = ["."]
