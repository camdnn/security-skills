# Checker defaults (TICKET-001 §6, §7).
line_tolerance: 5 # Lines a finding may sit outside a truth location and still match; also caps its span (§7.4, ADR-0006).
regression_f1_threshold: 0.05 # Mean F1 may not drop by more than this amount (§7.5).
trials_per_target: 3
max_trials:
  fast: 30
  full: 120
default_agent:
  fast: claude
  full: codex
models:
  claude: claude-sonnet-5-5
  codex: gpt-5.6-terra
context_file_line_limits:
  SECURITY-CONTEXT.md: 150
  PLAN.md: 100
  modules/*.md: 200
  decisions/*.md: 40
